<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="300" viewBox="0 0 1320 300"><rect width="1320" height="300" fill="#ffffff"/><path d="M0 14 H1320" stroke="#f97316" stroke-width="8"/><text x="46" y="55" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#c2410c" text-anchor="start">SUPPLYCHAIN GUARDIAN AI</text><text x="46" y="88" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="750" fill="#172033" text-anchor="start">Trust decisions that preserve the evidence trail</text><rect x="45" y="130" width="220" height="88" rx="16" fill="#fff7ed" stroke="#fed7aa"/><text x="155" y="168" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">SBOM</text><text x="155" y="193" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#667085" text-anchor="middle">+ workflow + artifact</text><path d="M273 174 H299" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/><rect x="315" y="130" width="190" height="88" rx="16" fill="#f8fafc" stroke="#fed7aa"/><text x="410" y="168" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Evidence rules</text><path d="M513 174 H539" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/><rect x="555" y="130" width="220" height="88" rx="16" fill="#fff7ed" stroke="#fed7aa"/><text x="665" y="168" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Explainable ML ranker</text><path d="M783 174 H809" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/><rect x="825" y="130" width="165" height="88" rx="16" fill="#f8fafc" stroke="#fed7aa"/><text x="907" y="168" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Policy gate</text><path d="M998 174 H1029" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/><rect x="1045" y="130" width="230" height="88" rx="16" fill="#fff7ed" stroke="#fed7aa"/><text x="1160" y="168" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">ALLOW / REVIEW / BLOCK</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f97316"/></marker></defs><text x="46" y="270" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#667085" text-anchor="start">Deterministic evidence stays visible; ML prioritizes; policy keeps critical integrity checks non-negotiable.</text></svg>